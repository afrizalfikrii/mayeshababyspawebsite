name: Keep Alive (Render, TiDB, Supabase)

on:
  schedule:
    # Berjalan otomatis 1 kali sehari pukul 01:00 UTC (08:00 WIB)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake up Render API, TiDB Cloud, and Supabase Storage
        run: |
          curl -sS --max-time 90 --retry 2 --retry-delay 5 https://mayesha-babyspa-api.onrender.com/api/keep-alive
          echo "Keep-alive ping berhasil dijalankan!"
